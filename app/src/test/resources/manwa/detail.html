<p class="comic-desc">阿尔克斯隶属于冒险者小队【残忍之刃】，某天，队长丹突然以他的技能在战斗中毫无用处为由，将他逐出队伍。 但他所持有的技能〈史莱姆〉，能够变身成史莱姆形态的【拟态】，还可以制造史莱姆分身的【分裂】，其中藏着一个秘密：分裂出多少个体，获得的经验值就会成倍增加。 察觉到技能真正力量的阿尔克斯，靠着这开挂级技能，踏上通往最强的道路 ——！</p>
