// Used only when assembling the independent reference test APK.
// The frozen Gradle files, production manifest and production APK stay intact.
allprojects { project ->
    project.afterEvaluate {
        if (project.plugins.hasPlugin('com.android.application')) {
            project.android.defaultConfig.testInstrumentationRunner = 'com.xxcomic.ParityReferenceInstrumentation'
        }
    }
}
