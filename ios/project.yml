name: XXComic
options:
  projectFormat: xcode15_3
  deploymentTarget:
    iOS: '16.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '16.0'
    TARGETED_DEVICE_FAMILY: '1,2'
packages:
  ComicCore:
    path: ComicCore
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20
targets:
  XXComic:
    type: application
    platform: iOS
    sources:
      - path: XXComic
        excludes: [Info.plist]
    dependencies:
      - package: ComicCore
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xxcomic.ios
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: XXComic/Info.plist
  XXComicUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - XXComicUITests
    dependencies:
      - target: XXComic
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.xxcomic.ios.uitests
schemes:
  XXComic:
    build:
      targets:
        XXComic: all
        XXComicUITests: [test]
    test:
      targets: [XXComicUITests]
