name: XXComic
options:
  projectFormat: xcode15_3
  deploymentTarget:
    iOS: '15.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '15.0'
    IPHONEOS_DEPLOYMENT_TARGET[sdk=iphonesimulator*]: '18.4'
    TARGETED_DEVICE_FAMILY: '1,2'
    ENABLE_DEBUG_DYLIB: NO
    LD_RUNPATH_SEARCH_PATHS: '$(inherited) @executable_path/Frameworks @loader_path/Frameworks /System/Cryptexes/OS/usr/lib/swift'
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      GCC_PREPROCESSOR_DEFINITIONS: '$(inherited) DEBUG=1'
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: ''
packages:
  ComicCore:
    path: ComicCore
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20
targets:
  FilesFixtureHost:
    type: application
    platform: iOS
    sources:
      - path: TestSupport/FilesFixtureHost
        excludes: [Info.plist]
      - path: XXComic/LaunchScreen.storyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xxcomic.tests.filesfixture
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: TestSupport/FilesFixtureHost/Info.plist
  XXComic:
    type: application
    platform: iOS
    sources:
      - path: XXComic
        excludes: [Info.plist]
    dependencies:
      - package: ComicCore
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xxcomic.ios
        MARKETING_VERSION: '2.0.47'
        CURRENT_PROJECT_VERSION: '347'
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: XXComic/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  XXComicTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - XXComicTests
    dependencies:
      - target: XXComic
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.xxcomic.ios.tests
  XXComicUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - XXComicUITests
    dependencies:
      - target: XXComic
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.xxcomic.ios.uitests
schemes:
  FilesFixtureHost:
    build:
      targets:
        FilesFixtureHost: all
  XXComic:
    build:
      targets:
        XXComic: all
        XXComicTests: [test]
        XXComicUITests: [test]
    test:
      targets: [XXComicTests, XXComicUITests]
      environmentVariables:
        XXCOMIC_NATIVE_TEST_HOST: '1'
