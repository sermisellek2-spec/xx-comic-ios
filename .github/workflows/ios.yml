name: iOS manual build

on:
  workflow_dispatch:
  push:
    branches:
      - codex/ios-port

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Select iPhone simulator
        shell: bash
        run: |
          ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data["devices"].items():
              if "iOS" in runtime:
                  for device in devices:
                      if device["name"].startswith("iPhone") and device["isAvailable"]:
                          print(device["udid"])
                          sys.exit(0)
          sys.exit("No available iPhone simulator")
          ')
          echo "IOS_TEST_DESTINATION=platform=iOS Simulator,id=$ID" >> "$GITHUB_ENV"

      - name: Build and test
        run: bash ios/scripts/build.sh

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: XXComic-unsigned
          path: ios/build/XXComic-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-test-results
          path: ios/build/ui-results-*/*.xcresult
          if-no-files-found: ignore
          retention-days: 7
