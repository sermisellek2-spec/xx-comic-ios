name: iOS manual build

on:
  workflow_dispatch:
    inputs:
      validation_scope:
        description: 阶段验证不产出IPA，完整回归通过后才允许打包
        type: choice
        options: [foundation-import, recovery-regression, cache-diagnostics, configuration-files, reader-modes, full]
        default: full
      package_ipa:
        description: 仅全部阶段自验通过后生成最终未签名IPA
        type: boolean
        default: false
  push:
    branches:
      - codex/ios-port

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'sermisellek2-spec/xx-comic-ios'
    runs-on: macos-14
    # CI 11 timed out while collecting every element through repeated IPC calls.
    # Keep the full matrix; one retained hierarchy per scene removes that overhead.
    timeout-minutes: 90
    env:
      # Repair uploads now run the complete UI/visual matrix. Partial scopes
      # remain available for diagnosis and never permit packaging.
      IOS_VALIDATION_SCOPE: ${{ github.event.inputs.validation_scope || 'full' }}
      IOS_PACKAGE_IPA: ${{ github.event.inputs.package_ipa || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Select iPhone and iPad simulators
        shell: bash
        run: |
          xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          iphone_id = None
          ipad_id = None
          for runtime, devices in data["devices"].items():
              if "iOS" in runtime:
                  for device in devices:
                      if device["isAvailable"]:
                          if device["name"].startswith("iPhone") and not iphone_id:
                              iphone_id = device["udid"]
                          elif device["name"].startswith("iPad") and not ipad_id:
                              ipad_id = device["udid"]
          if not iphone_id:
              sys.exit("No available iPhone simulator")
          if not ipad_id:
              sys.exit("No available iPad simulator")
          print(f"IOS_TEST_DESTINATION=platform=iOS Simulator,id={iphone_id}")
          if ipad_id:
              print(f"IOS_IPAD_DESTINATION=platform=iOS Simulator,id={ipad_id}")
          ' >> "$GITHUB_ENV"

      - name: Build and test
        run: bash ios/scripts/build.sh

      - name: Upload unsigned IPA
        if: success() && env.IOS_VALIDATION_SCOPE == 'full' && env.IOS_PACKAGE_IPA == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: XXComic-unsigned
          path: ios/build/XXComic-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Archive original UI test results
        if: always()
        run: python3 ios/scripts/archive_results.py ios/build

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-test-results
          path: |
            ios/build/test-result-archives/*.tar.gz
            ios/build/test-result-archives/manifest.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload visual matrix screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-matrix-screenshots
          path: |
            ios/build/evidence/visual-matrix/*.png
            ios/build/evidence/visual-provenance/*.json
            ios/build/evidence/ui-failures/*.png
            ios/build/evidence/ui-failures/*.jpg
            ios/build/evidence/ui-failures/*.txt
            ios/build/evidence/*-manifest.json
            ios/build/evidence/*-tests.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload AI enhancement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-enhancement-evidence
          path: ios/build/evidence/reader-enhancement/*
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload isolated offline HTTP cache evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: http-cache-evidence
          path: ios/build/evidence/http-cache/**
          if-no-files-found: ignore
          retention-days: 7
