name: iOS manual build

on:
  workflow_dispatch:
    inputs:
      validation_scope:
        description: 阶段验证不产出IPA，完整回归通过后才允许打包
        type: choice
        options: [foundation-import, recovery-regression, cache-diagnostics, settings-reference, configuration-files, reader-modes, final-flows, verification-ui, source-groups, full]
        default: full
      package_ipa:
        description: 仅全部阶段自验通过后生成最终未签名IPA
        type: boolean
        default: false
      validated_run_id:
        description: 视觉自验结束后填同版本full成功运行ID，只组装该次已验产物
        type: string
        required: false
        default: ''
  push:
    branches:
      - codex/ios-port

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'sermisellek2-spec/xx-comic-ios' && (github.event.inputs.validated_run_id || '') == ''
    runs-on: macos-14
    # The full suite runs both devices sequentially, including the expanded
    # reading/Files recovery checks and every visual scene. Keep that coverage.
    timeout-minutes: 180
    env:
      # Repair uploads now run the complete UI/visual matrix. Partial scopes
      # remain available for diagnosis and never permit packaging.
      IOS_VALIDATION_SCOPE: ${{ github.event.inputs.validation_scope || 'full' }}
      IOS_PACKAGE_IPA: ${{ github.event.inputs.package_ipa || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Select iPhone and iPad simulators
        shell: bash
        run: |
          python3 ios/scripts/select_simulators.py --output ios/build/evidence/simulator-selection >> "$GITHUB_ENV"

      - name: Upload original simulator inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-simulator-inventory
          path: ios/build/evidence/simulator-selection/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build and test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ios/build/evidence/build-logs
          bash ios/scripts/build.sh 2>&1 | tee ios/build/evidence/build-logs/build-and-test.log

      - name: Upload original build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-build-log
          path: ios/build/evidence/build-logs/build-and-test.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload unsigned IPA
        if: success() && env.IOS_VALIDATION_SCOPE == 'full' && env.IOS_PACKAGE_IPA == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: XXComic-unsigned
          path: ios/build/XXComic-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Archive fully validated Release product
        if: success() && env.IOS_VALIDATION_SCOPE == 'full'
        run: |
          cd ios
          python3 scripts/release_product.py archive \
            --app build/device/Build/Products/Release-iphoneos/XXComic.app \
            --log build/evidence/build-logs/build-and-test.log \
            --revision "$GITHUB_SHA" --output build/validated-release-product

      - name: Upload fully validated Release product
        if: success() && env.IOS_VALIDATION_SCOPE == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: iOS-validated-release-product
          path: ios/build/validated-release-product/
          if-no-files-found: error
          retention-days: 7

      - name: Archive original UI test results
        if: always()
        run: python3 ios/scripts/archive_results.py ios/build

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-test-results
          path: |
            ios/build/test-result-archives/*.tar.gz
            ios/build/test-result-archives/manifest.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload visual matrix screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-matrix-screenshots
          path: |
            ios/build/evidence/visual-matrix/*.png
            ios/build/evidence/visual-provenance/*.json
            ios/build/evidence/ui-failures/*.png
            ios/build/evidence/ui-failures/*.jpg
            ios/build/evidence/ui-failures/*.txt
            ios/build/evidence/reader-transitions/*.txt
            ios/build/evidence/app-icon/*.json
            ios/build/evidence/release-isolation.json
            ios/build/evidence/*-manifest.json
            ios/build/evidence/*-tests.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload AI enhancement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-enhancement-evidence
          path: ios/build/evidence/reader-enhancement/*
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload isolated offline HTTP cache evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: http-cache-evidence
          path: ios/build/evidence/http-cache/**
          if-no-files-found: ignore
          retention-days: 7

  package-validated:
    if: github.repository == 'sermisellek2-spec/xx-comic-ios' && (github.event.inputs.validated_run_id || '') != ''
    runs-on: macos-14
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Read actual preceding validation status
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_RUN_ID: ${{ inputs.validated_run_id }}
        run: |
          [[ "$VALIDATION_RUN_ID" =~ ^[0-9]+$ ]]
          mkdir -p ios/build
          gh api "repos/sermisellek2-spec/xx-comic-ios/actions/runs/$VALIDATION_RUN_ID" > ios/build/validation-run.json
      - uses: actions/download-artifact@v4
        with:
          name: iOS-validated-release-product
          path: ios/build/validated-release-product
          run-id: ${{ inputs.validated_run_id }}
          github-token: ${{ github.token }}
      - name: Package unchanged validated app bytes
        env:
          VALIDATION_RUN_ID: ${{ inputs.validated_run_id }}
        run: |
          python3 ios/scripts/release_product.py package \
            --product ios/build/validated-release-product \
            --run-proof ios/build/validation-run.json --run-id "$VALIDATION_RUN_ID" \
            --revision "$GITHUB_SHA" --output ios/build/final-package
      - uses: actions/upload-artifact@v4
        with:
          name: XXComic-unsigned
          path: ios/build/final-package/
          if-no-files-found: error
          retention-days: 7
