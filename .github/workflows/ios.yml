name: iOS manual build
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-manual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Select available iPhone simulator
        shell: bash
        run: |
          ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for k,vs in d["devices"].items() if "iOS" in k for v in vs if v["name"].startswith("iPhone")))')
          echo "IOS_TEST_DESTINATION=platform=iOS Simulator,id=$ID" >> "$GITHUB_ENV"
      - name: Test and build unsigned IPA
        run: bash ios/scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: XXComic-unsigned
          path: ios/build/XXComic-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iOS-test-results
          path: ios/build/ui-results-*/*.xcresult
          if-no-files-found: ignore
          retention-days: 7
