name: iOS manual build

on:
  workflow_dispatch:
  push:
    branches:
      - codex/ios-port

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Select iPhone and iPad simulators
        shell: bash
        run: |
          xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          iphone_id = None
          ipad_id = None
          for runtime, devices in data["devices"].items():
              if "iOS" in runtime:
                  for device in devices:
                      if device["isAvailable"]:
                          if device["name"].startswith("iPhone") and not iphone_id:
                              iphone_id = device["udid"]
                          elif device["name"].startswith("iPad") and not ipad_id:
                              ipad_id = device["udid"]
          if not iphone_id:
              sys.exit("No available iPhone simulator")
          print(f"IOS_TEST_DESTINATION=platform=iOS Simulator,id={iphone_id}")
          if ipad_id:
              print(f"IOS_IPAD_DESTINATION=platform=iOS Simulator,id={ipad_id}")
          ' >> "$GITHUB_ENV"

      - name: Build and test
        run: bash ios/scripts/build.sh

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: XXComic-unsigned
          path: ios/build/XXComic-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-test-results
          path: ios/build/ui-results-*/*.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload visual matrix screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-matrix-screenshots
          path: |
            ios/build/evidence/visual-matrix/*.png
            docs/ios-parity-2.0.40/review-evidence/visual-matrix/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload AI enhancement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-enhancement-evidence
          path: |
            ios/build/evidence/reader-enhancement/*
            docs/ios-parity-2.0.40/review-evidence/reader-enhancement/*
          if-no-files-found: ignore
          retention-days: 7
